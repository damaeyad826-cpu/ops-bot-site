<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secured Discord Dashboard</title>
    <style>
        :root { --bg-dark: #0f111a; --bg-panel: #161925; --primary: #3d5afe; --text-main: #ffffff; --text-muted: #a0a4b8; --border: #2a2d3e; --danger: #ff4d4d; --success: #00e676; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; }
        .sidebar { width: 260px; background-color: var(--bg-panel); border-right: 1px solid var(--border); padding: 20px 0; display: flex; flex-direction: column; }
        .sidebar-header { padding: 0 20px 20px; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid var(--border); margin-bottom: 15px; }
        .nav-item { padding: 15px 20px; color: var(--text-muted); cursor: pointer; transition: all 0.3s; font-size: 0.95rem; display: flex; align-items: center; gap: 10px; }
        .nav-item:hover, .nav-item.active { background-color: rgba(61, 90, 254, 0.1); color: var(--primary); border-left: 3px solid var(--primary); }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        section { display: none; background: var(--bg-panel); padding: 30px; border-radius: 10px; border: 1px solid var(--border); }
        section.active { display: block; }
        h2 { margin-bottom: 25px; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 12px; background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); border-radius: 6px; font-size: 1rem; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
        textarea { resize: vertical; min-height: 100px; }
        .btn { padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: 0.3s; color: white; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background-color: var(--primary); }
        .btn-primary:hover { background-color: #324ee3; }
        .btn-success { background-color: var(--success); color: #000;}
        .btn-success:hover { background-color: #00c853; }
        .btn-danger { background-color: var(--danger); padding: 8px 12px; font-size: 0.85rem; }
        .data-list { list-style: none; margin-top: 20px; }
        .data-list li { background: var(--bg-dark); border: 1px solid var(--border); padding: 15px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: rgba(61, 90, 254, 0.2); color: #8c9eff; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; margin-left: 10px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">⚙️ Bot Dashboard<br><small style="color:var(--success);font-size:12px;">Logged in securely</small></div>
        <div class="nav-item active" onclick="switchTab('commands')">💬 Custom Commands</div>
        <div class="nav-item" onclick="switchTab('tickets')">🎫 Ticket System Panel</div>
        <div class="nav-item" onclick="switchTab('moderation')">🛡️ Moderation Settings</div>
    </div>

    <div class="main-content">
        <!-- 1. Custom Commands Section -->
        <section id="commands" class="active">
            <h2>Custom Commands (No Prefix)</h2>
            <div class="form-group"><label>Command Trigger (الكلمة الأولى)</label><input type="text" id="cmd-trigger" placeholder="مثال: السلام"></div>
            <div class="form-group"><label>Bot Response (رد البوت)</label><textarea id="cmd-response" placeholder="مثال: وعليكم السلام"></textarea></div>
            <div class="form-group">
                <label>Select Required Role (الرتبة المسموح لها - اختياري)</label>
                <!-- هذه القائمة ستمتلئ تلقائياً من سيرفر الديسكورد -->
                <select id="cmd-role">
                    <option value="">✅ مسموح للجميع (Public)</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="addCommand()">Add Command</button>
            <ul id="commands-list" class="data-list"></ul>
        </section>

        <!-- 2. Ticket System Section -->
        <section id="tickets">
            <h2>Ticket System Panel & Transcripts</h2>
            <div class="form-group"><label>Panel Title (عنوان الرسالة)</label><input type="text" id="ticket-title" placeholder="الدعم الفني"></div>
            <div class="form-group"><label>Description (الوصف)</label><textarea id="ticket-desc"></textarea></div>
            <div class="form-group"><label>Button Text (نص الزر)</label><input type="text" id="ticket-btn"></div>
            <div class="form-group"><label>Channel ID (روم لوحة التذاكر)</label><input type="text" id="ticket-channel" placeholder="أيدي الروم الذي سيظهر فيه زر التذكرة"></div>
            
            <!-- إضافة خاصة بالترانسكربت -->
            <div class="form-group">
                <label style="color: var(--success);">Transcript Channel ID (روم حفظ السجلات بعد الإغلاق)</label>
                <input type="text" id="transcript-channel" placeholder="ضع أيدي الروم الذي سيُرسل إليه ملف المحادثة">
            </div>
            
            <div style="display: flex; gap: 15px; margin-top: 20px;">
                <button class="btn btn-primary" onclick="saveTicketSettings()">💾 Save Settings</button>
                <button class="btn btn-success" onclick="sendTicketPanel()">🚀 Send Panel to Discord</button>
            </div>
        </section>

        <!-- 3. Moderation Settings Section -->
        <section id="moderation">
            <h2>Moderation Settings (No Prefix)</h2>
            <div class="form-group">
                <label>Action</label>
                <select id="mod-action"><option value="ban">Ban (حظر)</option><option value="kick">Kick (طرد)</option><option value="mute">Mute (تايم أوت)</option></select>
            </div>
            <div class="form-group"><label>Custom Trigger (الكلمة المفتاحية)</label><input type="text" id="mod-trigger" placeholder="مثال: بان"></div>
            <button class="btn btn-primary" onclick="addModAlias()">Add Alias</button>
            <ul id="mod-list" class="data-list"></ul>
        </section>
    </div>

    <script>
        const API_URL = "http://localhost:3000/api";

        function switchTab(tabId) {
            document.querySelectorAll('section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // جلب الرتب من السيرفر وإضافتها للقائمة المنسدلة
        async function fetchRoles() {
            const res = await fetch(`${API_URL}/roles`);
            const roles = await res.json();
            const select = document.getElementById('cmd-role');
            roles.forEach(role => {
                select.innerHTML += `<option value="${role.id}">${role.name}</option>`;
            });
        }

        async function fetchCommands() {
            const res = await fetch(`${API_URL}/commands`);
            const cmds = await res.json();
            const list = document.getElementById('commands-list');
            list.innerHTML = '';
            cmds.forEach(cmd => {
                const roleText = cmd.role ? `<span class="badge">Role ID: ${cmd.role}</span>` : `<span class="badge" style="background:#2a2d3e;color:#a0a4b8">Public</span>`;
                list.innerHTML += `<li><div><strong>${cmd.trigger}</strong> ➡️ ${cmd.response} ${roleText}</div><button class="btn btn-danger" onclick="deleteCommand(${cmd.id})">Delete</button></li>`;
            });
        }

        async function addCommand() {
            const trigger = document.getElementById('cmd-trigger').value;
            const response = document.getElementById('cmd-response').value;
            const role = document.getElementById('cmd-role').value;
            if (!trigger || !response) return alert("يرجى ملء الكلمة والرد!");
            await fetch(`${API_URL}/commands`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ trigger, response, role }) });
            document.getElementById('cmd-trigger').value = '';
            document.getElementById('cmd-response').value = '';
            document.getElementById('cmd-role').value = '';
            fetchCommands();
        }

        async function deleteCommand(id) { await fetch(`${API_URL}/commands/${id}`, { method: 'DELETE' }); fetchCommands(); }

        async function fetchTicketSettings() {
            const res = await fetch(`${API_URL}/ticket-settings`);
            const data = await res.json();
            if (data) {
                document.getElementById('ticket-title').value = data.title || '';
                document.getElementById('ticket-desc').value = data.description || '';
                document.getElementById('ticket-btn').value = data.buttonText || '';
                document.getElementById('ticket-channel').value = data.channelId || '';
                document.getElementById('transcript-channel').value = data.transcriptChannelId || '';
            }
        }

        async function saveTicketSettings() {
            const payload = {
                title: document.getElementById('ticket-title').value,
                description: document.getElementById('ticket-desc').value,
                buttonText: document.getElementById('ticket-btn').value,
                channelId: document.getElementById('ticket-channel').value,
                transcriptChannelId: document.getElementById('transcript-channel').value
            };
            await fetch(`${API_URL}/ticket-settings`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            alert("✅ تم حفظ إعدادات التذكرة بنجاح!");
        }

        async function sendTicketPanel() {
            const res = await fetch(`${API_URL}/send-ticket-panel`, { method: 'POST' });
            const data = await res.json();
            if (data.success) alert("🚀 تم إنشاء لوحة التذاكر في السيرفر!");
            else alert("❌ فشل الإرسال: " + data.error);
        }

        async function fetchModAliases() {
            const res = await fetch(`${API_URL}/mod-aliases`);
            const aliases = await res.json();
            const list = document.getElementById('mod-list');
            list.innerHTML = '';
            aliases.forEach(alias => {
                const c = alias.action === 'ban' ? '#ff4d4d' : alias.action === 'kick' ? '#ff9800' : '#3d5afe';
                list.innerHTML += `<li><div><strong>${alias.trigger}</strong> ➡️ <span style="color:${c}; font-weight:bold;">${alias.action.toUpperCase()}</span></div><button class="btn btn-danger" onclick="deleteModAlias(${alias.id})">Delete</button></li>`;
            });
        }
        async function addModAlias() {
            const action = document.getElementById('mod-action').value, trigger = document.getElementById('mod-trigger').value;
            if (!trigger) return alert("اكتب الكلمة!");
            await fetch(`${API_URL}/mod-aliases`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, trigger }) });
            document.getElementById('mod-trigger').value = '';
            fetchModAliases();
        }
        async function deleteModAlias(id) { await fetch(`${API_URL}/mod-aliases/${id}`, { method: 'DELETE' }); fetchModAliases(); }

        window.onload = () => { fetchRoles(); fetchCommands(); fetchTicketSettings(); fetchModAliases(); };
    </script>
</body>
</html>
